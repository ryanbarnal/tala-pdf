    <style>
      /* Opening animation. It sits in the page itself so it shows before any script has loaded.
         It never blocks input, and it fades out on its own even if the app fails to start. */
      #splash {
        position: fixed; inset: 0; z-index: 1000; pointer-events: none;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(120% 90% at 30% 20%, #0e7c74 0%, #163a7a 55%, #0f1e3d 100%);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity .35s ease;
        animation: sp-out .35s ease 5s forwards;
      }
      #splash.done { opacity: 0; }
      .sp-mark { width: min(132px, 30vw); height: auto; overflow: visible; }
      .sp-word { width: min(200px, 46vw); height: auto; }
      .sp-tag { color: #c8d6ec; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; margin: -6px 0 0; }
      .sp-credit { position: absolute; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); color: #a9b9d6; font-size: 12.5px; margin: 0; }
      .sp-page, .sp-star { transform-box: fill-box; transform-origin: center; }
      .sp-l1, .sp-l2, .sp-l3 { stroke-dasharray: 120; }
      @media (prefers-reduced-motion: no-preference) {
        .sp-page { animation: sp-page .5s cubic-bezier(.2,.8,.2,1) .05s both; }
        .sp-star { animation: sp-star .62s cubic-bezier(.3,1.4,.4,1) .3s both; }
        .sp-l1 { animation: sp-line .24s ease-out .85s both; }
        .sp-l2 { animation: sp-line .24s ease-out 1.02s both; }
        .sp-l3 { animation: sp-line .2s ease-out 1.19s both; }
        .sp-word { animation: sp-rise .45s ease-out .95s both; }
        .sp-tag { animation: sp-rise .45s ease-out 1.1s both; }
        .sp-credit { animation: sp-fade .5s ease-out 1.25s both; }
      }
      @keyframes sp-page { from { opacity: 0; transform: translate(18px, 26px) rotate(6deg); } }
      @keyframes sp-star { from { opacity: 0; transform: scale(.35) rotate(-50deg); } }
      @keyframes sp-line { from { stroke-dashoffset: 120; } to { stroke-dashoffset: 0; } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(10px); } }
      @keyframes sp-fade { from { opacity: 0; } }
      @keyframes sp-out { to { opacity: 0; visibility: hidden; } }
    </style>
