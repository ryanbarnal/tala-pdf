    <title>Tala PDF</title>

    <style>
      /* Opening animation. It sits in the page itself so it shows before any script has loaded.
         It never blocks input, and it fades out on its own even if the app fails to start. */
      #splash {
        position: fixed; inset: 0; z-index: 1000; pointer-events: none;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: #ffffff; color: #111111;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity .35s ease;
        animation: sp-out .35s ease 5s forwards;
      }
      :root[data-theme='dark'] #splash { background: #0e0e0e; color: #ededed; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) #splash { background: #0e0e0e; color: #ededed; } }
      #splash.done { opacity: 0; }
      .sp-mark { width: min(84px, 22vw); height: auto; overflow: visible; }
      .sp-word { width: min(150px, 40vw); height: auto; }
      .sp-credit { position: absolute; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); font-size: 12px; letter-spacing: .02em; margin: 0; opacity: .5; }
      .sp-star, .sp-slit, .sp-hole { stroke-dasharray: 1; }
      @media (prefers-reduced-motion: no-preference) {
        .sp-star { animation: sp-draw .8s cubic-bezier(.45,0,.2,1) .1s both; }
        .sp-hole { animation: sp-draw .25s ease-out .85s both; }
        .sp-slit { animation: sp-draw .25s ease-out .95s both; }
        .sp-word { animation: sp-rise .5s ease-out .9s both; }
        .sp-credit { animation: sp-fade .5s ease-out 1.1s both; }
      }
      @keyframes sp-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(6px); } }
      @keyframes sp-fade { from { opacity: 0; } }
      @keyframes sp-out { to { opacity: 0; visibility: hidden; } }
    </style>
  </head>
